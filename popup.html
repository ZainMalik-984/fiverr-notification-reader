<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px "Segoe UI", Roboto, Arial, sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: #1dbf73; }
    .card { background: #f4f6f5; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
    .count { font-size: 24px; font-weight: 700; color: #1dbf73; }
    .last { color: #555; margin-top: 4px; word-break: break-word; }
    label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 7px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600; }
    #test { background: #1dbf73; color: #fff; }
    #clear { background: #e4e7e6; color: #222; }
  </style>
</head>
<body>
  <h1><span class="dot"></span>Fiverr Notification Reader</h1>
  <div class="card">
    <div><span class="count" id="count">0</span> unread</div>
    <div class="last" id="last">No notifications yet</div>
  </div>
  <label><input type="checkbox" id="overlay" /> On-page popup &amp; glow</label>
  <label><input type="checkbox" id="sound" /> Play sound</label>
  <label><input type="checkbox" id="desktop" /> Desktop alert when tab hidden</label>
  <div class="row">
    <button id="test">Test</button>
    <button id="clear">Clear</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
